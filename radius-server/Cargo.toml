[package]
name = "radius-server"
version = "0.1.0"
edition = "2021"

[dependencies]
radius-tokio = { git = "https://github.com/ogital-net/radius-tokio.git", branch = "main", default-features = false, features = ["dict-rfc", "dict-mikrotik", "radsec", "tracing"] }
log = "0.4"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "tracing-log"] }
tokio = { version = "1", features = ["net", "signal", "macros", "rt-multi-thread", "fs"] }

# Web server
axum = "0.8"
tower-http = { version = "0.6", features = ["cors"] }
serde = { version = "1", features = ["derive"] }
askama = "0.12"

# Database
sqlx = { version = "0.8", features = ["runtime-tokio", "sqlite"] }

# Password hashing
argon2 = "0.5"
rand = "0.8"

# Util
urlencoding = "2"
clickhouse = { version = "0.15.0", features = ["inserter", "time"] }
time = { version = "0.3.47", features = ["serde", "macros"] }
anyhow = "1.0.102"
